name: Build OrangeFox Android 14.1 for OPPO A38

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Free Standard Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gperf gcc-multilib g++-multilib \
          libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev \
          lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
          git repo curl python3 bc bison build-essential ccache flex zip libncurses6 lib32ncurses6

    - name: Configure Git Credentials
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@global.com"

    - name: Sync OrangeFox 14.1 Source Code
      run: |
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch 14.1 --path $GITHUB_WORKSPACE/fox

    - name: Clone Device Tree
      run: |
        cd fox
        git clone https://github.com/giel-arch/android_device_oppo_CPH2579.git device/oppo/CPH2579

    - name: Build OrangeFox Vendor Boot
      run: |
        cd fox
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_VIRTUAL_AB_DEVICE=1
        export FOX_VENDOR_BOOT_RECOVERY=1
        export FOX_RECOVERY_INSTALL_PARTITION="/vendor_boot"
        source build/envsetup.sh
        # Patch readonly variable errors in OrangeFox AOSP 14.1
        sed -i 's/AB_OTA_UPDATER :=/# AB_OTA_UPDATER :=/g' bootable/recovery/orangefox.mk || true
        sed -i 's/AB_OTA_UPDATER ?=/# AB_OTA_UPDATER ?=/g' bootable/recovery/orangefox.mk || true
        lunch twrp_CPH2579-ap2a-eng || lunch twrp_CPH2579-trunk_staging-eng || lunch twrp_CPH2579-eng
        mka vendorbootimage -j2

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-Android14-OPPO-A38-VendorBoot
        path: |
          fox/out/target/product/CPH2579/vendor_boot.img
