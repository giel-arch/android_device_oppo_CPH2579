# GitHub Actions workflow for building TWRP for OPPO A38 (CPH2579)

name: Build TWRP for OPPO A38 (CPH2579)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Clean up environment space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 20480
        swap-size-mb: 1024

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install repo tool
      run: |
        sudo apt-get update
        sudo apt-get install -y repo

    - name: Sync Android source
      env:
        BRANCH: lineage-20.0
      run: |
        repo init -u https://github.com/LineageOS/android.git -b $BRANCH --depth=1
        repo sync -c -j$(nproc) --no-clone-bundle --no-tags

    - name: Clone device tree
      run: |
        mkdir -p twrp/device/oppo/CPH2579
        git clone https://github.com/giel-arch/android_device_oppo_CPH2579.git twrp/device/oppo/CPH2579

    - name: Setup build environment
      run: |
        source build/envsetup.sh
        lunch lineage_$(basename $(pwd))_userdebug

    - name: Build TWRP
      run: |
        mka recoveryimage

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-OPPO-A38-CPH2579
        path: |
          twrp/out/target/product/CPH2579/vendor_boot.img
          twrp/out/target/product/CPH2579/boot.img
          twrp/out/target/product/CPH2579/recovery.img
          twrp/out/target/product/CPH2579/*.img
