name: Build OrangeFox Recovery for OPPO A38 (CPH2579)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Clean up environment space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Additional Free Disk Space Cleanup
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gperf gcc-multilib g++-multilib \
          libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev \
          lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
          git repo curl python3 bc bison build-essential ccache flex zip libncurses6 lib32ncurses6

    - name: Install Repo tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize OrangeFox Manifest
      run: |
        mkdir fox
        cd fox
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        repo init -u https://gitlab.com/OrangeFox/Manifest.git -b fox_12.1 --depth=1

    - name: Sync Source Code
      run: |
        cd fox
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --current-branch

    - name: Clone Device Tree
      run: |
        cd fox
        git clone https://github.com/giel-arch/android_device_oppo_CPH2579.git device/oppo/CPH2579

    - name: Build OrangeFox Recovery Image
      run: |
        cd fox
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch omni_CPH2579-eng || lunch omni_CPH2579-userdebug
        mka recoveryimage -j$(nproc --all)

    - name: Pack Ramdisk Fallback
      run: |
        cd fox
        OUT=out/target/product/CPH2579
        if [ -d "$OUT/recovery/root" ]; then
          cd $OUT/recovery/root
          find . | cpio -o -H newc | gzip -9 > ../../ramdisk-ofox.cpio.gz
        fi

    - name: Upload OrangeFox Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-OPPO-A38-CPH2579
        path: |
          fox/out/target/product/CPH2579/OrangeFox*.zip
          fox/out/target/product/CPH2579/vendor_boot.img
          fox/out/target/product/CPH2579/recovery.img
          fox/out/target/product/CPH2579/*.cpio.gz
