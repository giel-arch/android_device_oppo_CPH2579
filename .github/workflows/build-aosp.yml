name: Build AOSP Stock Recovery Android 15

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Free Standard Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gperf gcc-multilib g++-multilib \
          libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev \
          lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
          git repo curl python3 bc bison build-essential ccache flex zip libncurses6 lib32ncurses6

    - name: Install Repo tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Configure Git Credentials
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@global.com"

    - name: Initialize Manifest
      run: |
        mkdir aosp
        cd aosp
        # We use TWRP's minimal manifest as a base to save space, but we will replace the recovery component
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14 --depth=1

    - name: Sync Source Code
      run: |
        cd aosp
        repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j$(nproc)

    - name: Clone Device Tree
      run: |
        cd aosp
        git clone https://github.com/giel-arch/android_device_oppo_CPH2579.git device/oppo/CPH2579

    - name: Replace TWRP with Pure AOSP Stock Recovery
      run: |
        cd aosp
        rm -rf bootable/recovery
        # Pull the pure, unpatched stock recovery from Google's Android 15 source code
        git clone https://android.googlesource.com/platform/bootable/recovery -b android-15.0.0_r1 bootable/recovery

    - name: Build Pure AOSP Vendor Boot
      run: |
        cd aosp
        export ALLOW_MISSING_DEPENDENCIES=true
        export SOONG_SKIP_TESTS=true
        export SKIP_SOONG_TESTS=true
        source build/envsetup.sh
        lunch twrp_CPH2579-eng || lunch twrp_CPH2579-ap2a-eng
        mka vendorbootimage -j2

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AOSP-Stock-Android15-OPPO-A38-VendorBoot
        path: |
          aosp/out/target/product/CPH2579/vendor_boot.img
